name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gates (design §15)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Architecture (dependency direction, adapter boundaries)
        run: npm run check:architecture
      - name: Secret scan
        run: npm run check:secrets
      - name: Type check (strict)
        run: npm run typecheck
      - name: Lint (incl. no-floating-promises)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit, contract, integration and chaos tests with coverage gates
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Schema drift (EvidenceEnvelope JSON Schema must be regenerated)
        run: npm run schemas && git diff --exit-code schemas/
      - name: Controlled-DAG benchmark smoke run
        run: npm run eval:dag -- --tasks 100 --seed 7 --out evals/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            coverage/lcov.info
            evals/results/
          retention-days: 14

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: harness-dvo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
